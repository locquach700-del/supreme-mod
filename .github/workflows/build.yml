name: Build Modded APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool

      - name: Download base APK from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1 --pattern "base.apk" --repo locquach700-del/supreme-mod --dir . --clobber
          ls -lh base.apk

      - name: Inspect base APK
        run: |
          echo "--- libs ---"
          unzip -l base.apk | grep "lib/" || echo "no libs"
          echo "--- manifest snippet ---"
          ./apktool d base.apk -o decompiled -f
          grep -o 'android:extractNativeLibs="[^"]*"' decompiled/AndroidManifest.xml || echo "extractNativeLibs: not set"
          echo "--- minSdk ---"
          grep -E "minSdkVersion|targetSdkVersion" decompiled/apktool.yml

      - name: Force arm64 only
        run: |
          # Xóa mọi ABI không phải arm64-v8a để tránh lệch kiến trúc
          if [ -d decompiled/lib ]; then
            for d in decompiled/lib/*; do
              if [ "$(basename "$d")" != "arm64-v8a" ]; then
                echo "removing $d"
                rm -rf "$d"
              fi
            done
          fi
          mkdir -p decompiled/lib/arm64-v8a

      - name: Download Frida Gadget (arm64)
        run: |
          wget https://github.com/frida/frida/releases/download/16.5.9/frida-gadget-16.5.9-android-arm64.so.xz
          unxz frida-gadget-16.5.9-android-arm64.so.xz
          mv frida-gadget-16.5.9-android-arm64.so decompiled/lib/arm64-v8a/libfrida-gadget.so
          ls -lh decompiled/lib/arm64-v8a/

      - name: Copy mod.js and config
        run: |
          cp mod.js decompiled/lib/arm64-v8a/mod.js
          cat > decompiled/lib/arm64-v8a/libfrida-gadget.config.so << 'EOF'
          {
            "interaction": {
              "type": "script",
              "path": "mod.js"
            }
          }
          EOF

      - name: Raise minSdk if needed
        run: |
          YML=decompiled/apktool.yml
          MIN=$(grep -oE 'minSdkVersion: [0-9]+' "$YML" | grep -oE '[0-9]+' || echo 0)
          echo "current minSdk: $MIN"
          if [ "$MIN" -lt 21 ]; then
            sed -i 's/minSdkVersion: .*/minSdkVersion: 21/' "$YML"
            echo "raised to 21"
          fi

      - name: Patch smali to load Frida Gadget
        run: |
          SMALI_FILE=$(find decompiled/smali* -name "UnityPlayerActivity.smali" 2>/dev/null | head -1)
          if [ -z "$SMALI_FILE" ]; then
            SMALI_FILE=$(find decompiled/smali* -name "MainActivity.smali" 2>/dev/null | head -1)
          fi
          if [ -z "$SMALI_FILE" ]; then
            SMALI_FILE=$(find decompiled/smali* -name "*.smali" 2>/dev/null | xargs grep -l "Lcom/unity3d/player/UnityPlayerActivity;" 2>/dev/null | head -1)
          fi
          if [ -z "$SMALI_FILE" ]; then
            echo "No suitable activity smali found. Exiting."
            exit 1
          fi
          echo "Patching: $SMALI_FILE"
          # Tránh patch đè nếu chạy lại
          if grep -q 'frida-gadget' "$SMALI_FILE"; then
            echo "already patched"
          else
            sed -i '/invoke-super {p0, p1}, Landroid\/app\/Activity;->onCreate(Landroid\/os\/Bundle;)V/a \
              const-string v0, "frida-gadget"\n\
              invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V' "$SMALI_FILE"
          fi

      - name: Rebuild APK
        run: |
          ./apktool b decompiled -o modded-unsigned.apk
          ls -lh modded-unsigned.apk

      - name: Zipalign and Sign APK (v1+v2)
        run: |
          sudo apt-get install -y zipalign || true
          # uber-apk-signer tự zipalign + ký v1+v2
          java -jar uber-apk-signer.jar -a modded-unsigned.apk --out modded --allowResign -v1SigningEnabled true -v2SigningEnabled true
          ls -lh modded/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: modded-apk
          path: modded/*.apk
